<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Gastos</title>
<style>
:root{
  --bg:#f4f5f9; --card:#fff; --tx:#111827; --mut:#6b7280; --bd:#e5e7eb;
  --pri:#4f46e5; --pri-h:#4338ca; --pri-l:#eef2ff; --dan:#dc2626; --dan-l:#fef2f2; --r:14px;
  --sh:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 70px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:20px;margin:0;letter-spacing:-.2px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--bd)}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:#fff;color:var(--tx);padding:9px 14px;border-radius:10px;font-weight:600;transition:.15s}
.btn:hover{background:#f9fafb}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn-pri:hover{background:var(--pri-h)}
.btn-dan{background:var(--dan);border-color:var(--dan);color:#fff}
.btn-dan:hover{background:#b91c1c}
.btn-sm{padding:6px 11px;font-size:13px}
.btn-ico{padding:9px;width:40px;height:40px;justify-content:center}
svg{width:18px;height:18px;flex:none}
.mes-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;margin-bottom:14px}
.mes-centro{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.mes-label{font-size:18px;font-weight:700;min-width:150px;text-align:center}
input,select,textarea{font:inherit;color:var(--tx);border:1px solid var(--bd);background:#fff;border-radius:10px;padding:9px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
.mes-bar input[type=month]{width:auto}
.resumo{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px}
.total{padding:20px}
.total .lbl{color:var(--mut);font-size:14px}
.total .val{font-size:34px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.total .sub{color:var(--mut);font-size:13px;margin-top:4px}
.cats{padding:16px 20px}
.cats h2,.filtros h2{font-size:13px;color:var(--mut);margin:0 0 10px;text-transform:uppercase;letter-spacing:.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--bd);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--tx)}
.chip:hover{border-color:var(--pri);background:var(--pri-l)}
.chip b{margin-left:6px;color:var(--pri)}
.vazio-cats{color:var(--mut);font-size:14px}
.filtros{padding:16px 20px;margin-bottom:14px}
.grade-filtros{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.filtros-rodape{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap}
.info-filtro{color:var(--mut);font-size:13px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.lista{padding:6px 8px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);text-align:left;padding:12px 10px;border-bottom:1px solid var(--bd)}
td{padding:12px 10px;border-bottom:1px solid #f1f2f6;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafafe}
.num{text-align:right;white-space:nowrap;font-weight:700}
.acoes{white-space:nowrap;text-align:right}
.acoes .btn{margin-left:6px}
.tag{display:inline-block;background:var(--pri-l);color:var(--pri);padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
.desc{color:var(--mut)}
.cards{display:none}
.gasto-card{padding:14px;border-bottom:1px solid #f1f2f6}
.gasto-card:last-child{border-bottom:0}
.gc-l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.gc-nome{font-weight:700}
.gc-val{font-weight:800;white-space:nowrap}
.gc-l2{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.gc-data{color:var(--mut);font-size:13px}
.gc-desc{color:var(--mut);font-size:14px;margin-bottom:8px;word-break:break-word}
.gc-acoes{display:flex;gap:8px}
.vazio{text-align:center;color:var(--mut);padding:36px 12px}
.status{display:none;align-items:center;gap:8px;color:var(--mut);font-size:14px;margin-bottom:12px}
.status.on{display:flex}
.spin{width:14px;height:14px;border:2px solid var(--bd);border-top-color:var(--pri);border-radius:50%;animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.carregando .lista,.carregando .resumo{opacity:.55;transition:.15s}
.erro-banner{display:none;background:var(--dan-l);color:#991b1b;border:1px solid #fecaca;border-radius:12px;padding:12px 14px;margin-bottom:14px;align-items:center;justify-content:space-between;gap:10px}
.erro-banner.on{display:flex}
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{margin:0 0 16px;font-size:18px}
.campo{margin-bottom:14px}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.erro-form{color:var(--dan);font-size:14px;margin-bottom:12px;display:none}
.erro-form.on{display:block}
.modal-acoes{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--dan)}
@media(min-width:760px){.resumo{grid-template-columns:1fr 1.4fr}}
@media(max-width:900px){.grade-filtros{grid-template-columns:1fr 1fr}}
@media(max-width:720px){
  table{display:none}
  .cards{display:block}
  .mes-bar{flex-direction:column;align-items:stretch}
  .mes-centro{justify-content:space-between;flex-wrap:nowrap}
  .mes-label{min-width:0;flex:1}
  .mes-bar .extra{display:flex;gap:8px}
  .total .val{font-size:30px}
}
@media(max-width:520px){
  .grade-filtros{grid-template-columns:1fr}
  .linha2{grid-template-columns:1fr}
  .top .txt{display:none}
}
</style>
</head>
<body>
<div class="wrap" id="app">

  <div class="top">
    <h1>Controle de Gastos</h1>
    <button class="btn btn-pri" id="btnAdicionar" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Adicionar gasto
    </button>
  </div>

  <div class="card mes-bar">
    <div class="mes-centro">
      <button class="btn btn-ico" id="btnMesAnt" type="button" aria-label="Mês anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="mes-label" id="mesLabel">—</div>
      <button class="btn btn-ico" id="btnMesProx" type="button" aria-label="Próximo mês">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <div class="extra" style="display:flex;gap:8px;align-items:center">
      <input type="month" id="mesInput" aria-label="Selecionar mês">
      <button class="btn" id="btnHoje" type="button">Hoje</button>
    </div>
  </div>

  <div class="status" id="status"><div class="spin"></div><span>Carregando...</span></div>

  <div class="erro-banner" id="erroBanner">
    <span id="erroTexto">Não foi possível carregar os dados. Tente novamente.</span>
    <button class="btn btn-sm" id="btnTentar" type="button">Tentar novamente</button>
  </div>

  <div class="resumo">
    <div class="card total">
      <div class="lbl" id="totalLabel">Total do mês</div>
      <div class="val" id="totalValor">R$ 0,00</div>
      <div class="sub" id="totalSub"></div>
    </div>
    <div class="card cats">
      <h2>Por categoria</h2>
      <div class="chips" id="chipsCats"></div>
    </div>
  </div>

  <div class="card filtros">
    <h2>Filtros</h2>
    <div class="grade-filtros">
      <div><label for="fBusca">Pesquisar</label><input id="fBusca" type="search" placeholder="Pesquisa geral (ex.: Uber)" autocomplete="off"></div>
      <div><label for="fNome">Nome</label><input id="fNome" type="text" autocomplete="off"></div>
      <div><label for="fCategoria">Categoria</label><select id="fCategoria"></select></div>
      <div><label for="fDescricao">Descrição</label><input id="fDescricao" type="text" autocomplete="off"></div>
    </div>
    <div class="filtros-rodape">
      <span class="info-filtro" id="infoFiltro"></span>
      <button class="btn btn-sm" id="btnLimpar" type="button">Limpar filtros</button>
    </div>
  </div>

  <div class="card lista">
    <table>
      <thead>
        <tr><th>Data</th><th>Nome</th><th>Categoria</th><th>Descrição</th><th style="text-align:right">Valor</th><th style="text-align:right">Ações</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="cards" id="cards"></div>
    <div class="vazio" id="vazio" style="display:none"></div>
  </div>
</div>

<!-- Modal: formulário -->
<div class="overlay" id="modalForm">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="formTitulo">
    <h3 id="formTitulo">Adicionar gasto</h3>
    <form id="form" novalidate>
      <div class="erro-form" id="formErro"></div>
      <div class="linha2">
        <div class="campo"><label for="gData">Data *</label><input type="date" id="gData" required></div>
        <div class="campo"><label for="gValor">Valor (R$) *</label><input type="text" id="gValor" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>
      </div>
      <div class="campo"><label for="gNome">Nome *</label><input type="text" id="gNome" maxlength="100" autocomplete="off"></div>
      <div class="campo">
        <label for="gCategoria">Categoria *</label>
        <select id="gCategoria"></select>
      </div>
      <div class="campo" id="boxNovaCat" style="display:none">
        <label for="gNovaCat">Nome da nova categoria *</label>
        <input type="text" id="gNovaCat" maxlength="40" autocomplete="off">
      </div>
      <div class="campo"><label for="gDescricao">Descrição (opcional)</label><input type="text" id="gDescricao" maxlength="500" autocomplete="off"></div>
      <div class="modal-acoes">
        <button type="button" class="btn" id="btnCancelarForm">Cancelar</button>
        <button type="submit" class="btn btn-pri" id="btnSalvar">Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal: confirmação de exclusão -->
<div class="overlay" id="modalExcluir">
  <div class="modal" role="alertdialog" aria-modal="true" style="max-width:400px">
    <h3>Excluir gasto</h3>
    <p style="margin:0 0 18px;color:var(--mut)">Tem certeza que deseja excluir este gasto?</p>
    <div class="modal-acoes">
      <button type="button" class="btn" id="btnCancelarExcluir">Cancelar</button>
      <button type="button" class="btn btn-dan" id="btnConfirmarExcluir">Excluir</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var moeda = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  var NOVA = '__nova__';
  var ICO_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>';
  var ICO_DEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>';

  var state = { mes: '', gastos: [], categorias: [], editandoId: null, excluindoId: null, req: 0, salvando: false };

  function $(id) { return document.getElementById(id); }
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(s) { return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
  function hojeIso() { var d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
  function dataBr(iso) { var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function nomeMes(ym) { var p = ym.split('-'); return MESES[Number(p[1]) - 1] + ' ' + p[0]; }

  function parseValor(txt) {
    var s = String(txt == null ? '' : txt).replace(/R\$|\s/g, '');
    if (!s) return NaN;
    if (s.indexOf(',') !== -1) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    if (!/^\d+(\.\d+)?$/.test(s)) return NaN;
    return Math.round(parseFloat(s) * 100) / 100;
  }

  function chamar(nome) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      r[nome].apply(r, args);
    });
  }

  function toast(msg, erro) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast on' + (erro ? ' err' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = 'toast'; }, 3200);
  }

  /* ---------- carregamento ---------- */
  function setCarregando(on) {
    $('status').classList.toggle('on', on);
    $('app').classList.toggle('carregando', on);
  }
  function mostrarErro(msg) {
    $('erroTexto').textContent = msg || 'Não foi possível carregar os dados. Tente novamente.';
    $('erroBanner').classList.add('on');
  }

  function carregar() {
    var minha = ++state.req;
    setCarregando(true);
    $('erroBanner').classList.remove('on');
    $('mesLabel').textContent = nomeMes(state.mes);
    $('mesInput').value = state.mes;
    return chamar('getDados', state.mes).then(function (r) {
      if (minha !== state.req) return;
      if (!r || !r.ok) { mostrarErro(r && r.erro ? r.erro : null); return; }
      state.gastos = r.gastos || [];
      state.categorias = r.categorias || [];
      render();
    }).catch(function (e) {
      if (minha !== state.req) return;
      console.error(e);
      mostrarErro();
    }).then(function () {
      if (minha === state.req) setCarregando(false);
    });
  }

  /* ---------- mês ---------- */
  function mudarMes(delta) {
    var p = state.mes.split('-');
    var d = new Date(Number(p[0]), Number(p[1]) - 1 + delta, 1);
    state.mes = d.getFullYear() + '-' + p2(d.getMonth() + 1);
    carregar();
  }

  /* ---------- filtros ---------- */
  function filtrosAtivos() {
    return !!($('fBusca').value.trim() || $('fNome').value.trim() || $('fCategoria').value || $('fDescricao').value.trim());
  }
  function gastosFiltrados() {
    var q = norm($('fBusca').value.trim());
    var fn = norm($('fNome').value.trim());
    var fc = $('fCategoria').value;
    var fd = norm($('fDescricao').value.trim());
    return state.gastos.filter(function (g) {
      if (fn && norm(g.nome).indexOf(fn) === -1) return false;
      if (fc && g.categoria !== fc) return false;
      if (fd && norm(g.descricao).indexOf(fd) === -1) return false;
      if (q) {
        var alvo = norm([g.nome, g.categoria, g.descricao, dataBr(g.data), moeda.format(g.valor), String(g.valor).replace('.', ',')].join(' | '));
        if (alvo.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  /* ---------- renderização ---------- */
  function render() {
    var total = state.gastos.reduce(function (s, g) { return s + g.valor; }, 0);
    $('totalLabel').textContent = 'Total de ' + nomeMes(state.mes).replace(' ', ' de ');
    $('totalValor').textContent = moeda.format(total);
    $('totalSub').textContent = state.gastos.length + (state.gastos.length === 1 ? ' gasto no mês' : ' gastos no mês');
    renderChips();
    renderSelectFiltro();
    renderLista();
  }

  function renderChips() {
    var soma = {};
    state.gastos.forEach(function (g) { var c = g.categoria || 'Sem categoria'; soma[c] = (soma[c] || 0) + g.valor; });
    var itens = Object.keys(soma).map(function (c) { return { c: c, v: soma[c] }; }).sort(function (a, b) { return b.v - a.v; });
    var box = $('chipsCats');
    if (!itens.length) { box.innerHTML = '<span class="vazio-cats">Nenhum gasto neste mês.</span>'; return; }
    box.innerHTML = itens.map(function (i) {
      return '<button type="button" class="chip" data-cat="' + esc(i.c) + '">' + esc(i.c) + '<b>' + esc(moeda.format(i.v)) + '</b></button>';
    }).join('');
  }

  function renderSelectFiltro() {
    var sel = $('fCategoria');
    var atual = sel.value;
    var nomes = state.categorias.slice();
    state.gastos.forEach(function (g) { if (g.categoria && nomes.indexOf(g.categoria) === -1) nomes.push(g.categoria); });
    sel.innerHTML = '<option value="">Todas as categorias</option>' +
      nomes.map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join('');
    sel.value = nomes.indexOf(atual) !== -1 ? atual : '';
  }

  function renderLista() {
    var lista = gastosFiltrados();
    var ativos = filtrosAtivos();
    var somaF = lista.reduce(function (s, g) { return s + g.valor; }, 0);
    $('infoFiltro').textContent = ativos
      ? 'Mostrando ' + lista.length + ' de ' + state.gastos.length + ' · ' + moeda.format(somaF)
      : '';

    var vazio = $('vazio');
    if (!lista.length) {
      vazio.style.display = 'block';
      vazio.textContent = state.gastos.length ? 'Nenhum gasto corresponde aos filtros.' : 'Nenhum gasto neste mês. Clique em "Adicionar gasto" para começar.';
    } else {
      vazio.style.display = 'none';
    }

    $('tbody').innerHTML = lista.map(function (g) {
      return '<tr>' +
        '<td>' + esc(dataBr(g.data)) + '</td>' +
        '<td>' + esc(g.nome) + '</td>' +
        '<td><span class="tag">' + esc(g.categoria) + '</span></td>' +
        '<td class="desc">' + esc(g.descricao) + '</td>' +
        '<td class="num">' + esc(moeda.format(g.valor)) + '</td>' +
        '<td class="acoes">' +
          '<button type="button" class="btn btn-sm" data-acao="editar" data-id="' + esc(g.id) + '">Editar</button>' +
          '<button type="button" class="btn btn-sm" data-acao="excluir" data-id="' + esc(g.id) + '" style="color:var(--dan)">Excluir</button>' +
        '</td></tr>';
    }).join('');

    $('cards').innerHTML = lista.map(function (g) {
      return '<div class="gasto-card">' +
        '<div class="gc-l1"><span class="gc-nome">' + esc(g.nome) + '</span><span class="gc-val">' + esc(moeda.format(g.valor)) + '</span></div>' +
        '<div class="gc-l2"><span class="tag">' + esc(g.categoria) + '</span><span class="gc-data">' + esc(dataBr(g.data)) + '</span></div>' +
        (g.descricao ? '<div class="gc-desc">' + esc(g.descricao) + '</div>' : '') +
        '<div class="gc-acoes">' +
          '<button type="button" class="btn btn-sm" data-acao="editar" data-id="' + esc(g.id) + '">Editar</button>' +
          '<button type="button" class="btn btn-sm" data-acao="excluir" data-id="' + esc(g.id) + '" style="color:var(--dan)">Excluir</button>' +
        '</div></div>';
    }).join('');
  }

  /* ---------- formulário ---------- */
  function preencherSelectForm(selecionada) {
    var nomes = state.categorias.slice();
    if (selecionada && nomes.indexOf(selecionada) === -1) nomes.push(selecionada);
    $('gCategoria').innerHTML = '<option value="">Selecione...</option>' +
      nomes.map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join('') +
      '<option value="' + NOVA + '">+ Nova categoria</option>';
    $('gCategoria').value = selecionada || '';
  }

  function abrirForm(gasto) {
    state.editandoId = gasto ? gasto.id : null;
    $('formTitulo').textContent = gasto ? 'Editar gasto' : 'Adicionar gasto';
    $('gData').value = gasto ? gasto.data : hojeIso();
    $('gNome').value = gasto ? gasto.nome : '';
    $('gDescricao').value = gasto ? gasto.descricao : '';
    $('gValor').value = gasto ? gasto.valor.toFixed(2).replace('.', ',') : '';
    $('gNovaCat').value = '';
    $('boxNovaCat').style.display = 'none';
    preencherSelectForm(gasto ? gasto.categoria : '');
    erroForm('');
    $('btnSalvar').disabled = false;
    $('btnSalvar').textContent = 'Salvar';
    $('modalForm').classList.add('on');
    setTimeout(function () { (gasto ? $('gNome') : $('gNome')).focus(); }, 50);
  }
  function fecharForm() { $('modalForm').classList.remove('on'); state.editandoId = null; }
  function erroForm(msg) {
    var e = $('formErro');
    e.textContent = msg;
    e.classList.toggle('on', !!msg);
  }

  function salvar(ev) {
    ev.preventDefault();
    if (state.salvando) return;

    var data = $('gData').value;
    var nome = $('gNome').value.trim();
    var descricao = $('gDescricao').value.trim();
    var valor = parseValor($('gValor').value);
    var catSel = $('gCategoria').value;
    var novaCat = $('gNovaCat').value.trim();

    if (!data) return erroForm('Informe a data.');
    if (!nome) return erroForm('Informe o nome.');
    if (!catSel) return erroForm('Selecione uma categoria.');
    if (catSel === NOVA && !novaCat) return erroForm('Informe o nome da nova categoria.');
    if (isNaN(valor)) return erroForm('Informe um valor válido. Exemplos: 10, 10,50, 125,90.');
    if (valor <= 0) return erroForm('O valor deve ser maior que zero.');
    erroForm('');

    state.salvando = true;
    $('btnSalvar').disabled = true;
    $('btnSalvar').textContent = 'Salvando...';

    var edicao = !!state.editandoId;
    var etapaCategoria = catSel === NOVA
      ? chamar('adicionarCategoria', novaCat).then(function (r) {
          if (!r || !r.ok) throw new Error((r && r.erro) || 'Falha ao criar categoria.');
          state.categorias = r.categorias || state.categorias;
          return r.categoria;
        })
      : Promise.resolve(catSel);

    etapaCategoria.then(function (categoria) {
      var payload = { id: state.editandoId, data: data, nome: nome, categoria: categoria, descricao: descricao, valor: valor };
      return chamar(edicao ? 'editarGasto' : 'adicionarGasto', payload);
    }).then(function (r) {
      if (!r || !r.ok) throw new Error((r && r.erro) || 'Falha ao salvar.');
      fecharForm();
      state.mes = data.substring(0, 7); // mostra o mês do gasto salvo
      toast(edicao ? 'Gasto atualizado com sucesso.' : 'Gasto adicionado com sucesso.');
      return carregar();
    }).catch(function (e) {
      console.error(e);
      erroForm(e && e.message && e.message.length < 140 ? e.message.replace(/^Error:\s*/, '') : 'Não foi possível salvar. Tente novamente.');
    }).then(function () {
      state.salvando = false;
      $('btnSalvar').disabled = false;
      $('btnSalvar').textContent = 'Salvar';
    });
  }

  /* ---------- exclusão ---------- */
  function pedirExclusao(id) {
    state.excluindoId = id;
    $('btnConfirmarExcluir').disabled = false;
    $('btnConfirmarExcluir').textContent = 'Excluir';
    $('modalExcluir').classList.add('on');
  }
  function fecharExclusao() { $('modalExcluir').classList.remove('on'); state.excluindoId = null; }
  function confirmarExclusao() {
    var id = state.excluindoId;
    if (!id) return;
    $('btnConfirmarExcluir').disabled = true;
    $('btnConfirmarExcluir').textContent = 'Excluindo...';
    chamar('excluirGasto', id).then(function (r) {
      if (!r || !r.ok) throw new Error((r && r.erro) || 'Falha ao excluir.');
      fecharExclusao();
      toast('Gasto excluído.');
      return carregar();
    }).catch(function (e) {
      console.error(e);
      fecharExclusao();
      toast('Não foi possível excluir. Tente novamente.', true);
    });
  }

  /* ---------- eventos ---------- */
  function limparFiltros() {
    $('fBusca').value = ''; $('fNome').value = ''; $('fDescricao').value = ''; $('fCategoria').value = '';
    renderLista();
  }

  function init() {
    state.mes = hojeIso().substring(0, 7);

    $('btnAdicionar').addEventListener('click', function () { abrirForm(null); });
    $('btnMesAnt').addEventListener('click', function () { mudarMes(-1); });
    $('btnMesProx').addEventListener('click', function () { mudarMes(1); });
    $('btnHoje').addEventListener('click', function () { state.mes = hojeIso().substring(0, 7); carregar(); });
    $('mesInput').addEventListener('change', function () {
      if (/^\d{4}-\d{2}$/.test(this.value)) { state.mes = this.value; carregar(); }
    });
    $('btnTentar').addEventListener('click', carregar);

    ['fBusca', 'fNome', 'fDescricao'].forEach(function (id) { $(id).addEventListener('input', renderLista); });
    $('fCategoria').addEventListener('change', renderLista);
    $('btnLimpar').addEventListener('click', limparFiltros);

    $('chipsCats').addEventListener('click', function (e) {
      var b = e.target.closest('.chip');
      if (!b) return;
      $('fCategoria').value = b.getAttribute('data-cat');
      renderLista();
    });

    function delegarAcoes(e) {
      var b = e.target.closest('button[data-acao]');
      if (!b) return;
      var id = b.getAttribute('data-id');
      if (b.getAttribute('data-acao') === 'editar') {
        var g = state.gastos.filter(function (x) { return x.id === id; })[0];
        if (g) abrirForm(g);
      } else {
        pedirExclusao(id);
      }
    }
    $('tbody').addEventListener('click', delegarAcoes);
    $('cards').addEventListener('click', delegarAcoes);

    $('form').addEventListener('submit', salvar);
    $('btnCancelarForm').addEventListener('click', fecharForm);
    $('gCategoria').addEventListener('change', function () {
      var nova = this.value === NOVA;
      $('boxNovaCat').style.display = nova ? 'block' : 'none';
      if (nova) $('gNovaCat').focus();
    });

    $('btnCancelarExcluir').addEventListener('click', fecharExclusao);
    $('btnConfirmarExcluir').addEventListener('click', confirmarExclusao);

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { fecharForm(); fecharExclusao(); }
    });
    $('modalForm').addEventListener('mousedown', function (e) { if (e.target === this) fecharForm(); });
    $('modalExcluir').addEventListener('mousedown', function (e) { if (e.target === this) fecharExclusao(); });

    carregar();
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
